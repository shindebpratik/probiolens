
name: probiolens

channels:
  - conda-forge
  - bioconda

dependencies:
  # Python environment
  - python=3.12
  - pip

  # ProbioLens Python dependencies
  - numpy=1.26.4
  - pandas=2.2.3
  - scikit-learn=1.6.1

  # Assembly
  - megahit=1.2.9

  # Read mapping
  - bowtie2=2.5.5
  - samtools=1.25

  # Metagenomic binning
  - metabat2=2.12.1

  # MAG quality assessment
  - checkm2=1.1.0
